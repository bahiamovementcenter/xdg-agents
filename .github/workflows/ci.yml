name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, test and check layouts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Flake check
        run: nix flake check -L

      # Builds the shell once, so the timings of the steps below are their own
      - name: Enter the development shell
        run: nix develop --command true

      - name: Formatting
        run: |
          nix develop --command bash -euo pipefail -c '
            unformatted="$(gofmt -l .)"
            if [ -n "$unformatted" ]; then
              echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
            fi
            nixfmt --check flake.nix
            nickel format --check $(git ls-files "*.ncl")
          '

      # Every layout must typecheck and pass its contract (agents/schema.ncl),
      # which runs when it is exported
      - name: Agent layouts
        run: |
          nix develop --command bash -euo pipefail -c '
            for f in $(git ls-files "*.ncl"); do
              echo "typecheck $f"; nickel typecheck "$f"
            done
            for f in $(git ls-files "agents/*.ncl" | grep -v "^agents/schema.ncl$"); do
              echo "export $f"; nickel export "$f" > /dev/null
            done
          '

      - name: Vet and lint
        run: nix develop --command bash -euo pipefail -c 'go vet ./... && golangci-lint run'

      - name: Test
        run: nix develop --command go test ./...

      # On the CI machine no agent is installed, so status reports none; the
      # tests cover reports on fake home folders
      - name: Build and run
        run: nix develop --command bash -euo pipefail -c 'go build -o xdg-agents . && ./xdg-agents list && ./xdg-agents status && ./xdg-agents plan'
